name: Dependency security audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/public-release-prep]
permissions:
  contents: read
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit -r app/requirements.txt --progress-spinner off
  javascript-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency tree without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
