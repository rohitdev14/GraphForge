services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://graphforge:${GRAPHFORGE_DB_PASSWORD:?Set GRAPHFORGE_DB_PASSWORD in root .env}@db:5432/graphforge
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: graphforge
      POSTGRES_PASSWORD: ${GRAPHFORGE_DB_PASSWORD:?Set GRAPHFORGE_DB_PASSWORD in root .env}
      POSTGRES_DB: graphforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d graphforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ../frontend:/workspace
      - frontend_modules:/workspace/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_modules:
